<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Invoices{% endblock %} · {{ business_name|default:"Invoices" }}</title>
<style>
:root{--green:#08845f;--green-dark:#066a4c;--green-soft:#e7f5ef;--ink:#2b3a42;--muted:#5f6c76;--faint:#6f7b85;--line:#e3e8ec;--wash:#f6f9fb;--danger:#b42318;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
a{color:var(--green);text-underline-offset:3px}
a:hover{color:var(--green-dark)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
h1{margin:0 0 16px;font-size:34px;line-height:1.25;font-weight:500;letter-spacing:-.01em}
h2{margin:0 0 12px;font-size:24px;line-height:1.3;font-weight:500}
p{margin:0 0 14px}
.muted{color:var(--muted)}

/* Header */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--green);text-decoration:none;font-weight:600;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
.logo svg{width:24px;height:24px}
.nav{display:flex;align-items:center;gap:22px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav a.plain{color:var(--ink);text-decoration:none}

/* Hero */
.hero{padding:56px 0 72px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:start}
.hero .intro{padding-top:8px}
.hero .intro svg.art{margin-top:18px}
.hero p.lead{font-size:15px;color:var(--muted);max-width:44ch;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 26px;border:0;border-radius:3px;background:var(--green);color:#fff;font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--green-dark);color:#fff}
.btn[disabled]{opacity:.7;cursor:progress}
.btn.block{width:100%}
.hero svg.art{width:100%;height:auto;display:block;overflow:visible}


/* Sections */
.section{padding:76px 0}
.section.alt{background:var(--wash)}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.row .copy{padding-top:8px}
.row .copy p{font-size:14px;color:var(--muted);max-width:40ch}
.row .copy .more{font-size:13px;font-weight:600;text-decoration:none}
.steps{list-style:none;margin:22px 0 22px;padding:0;display:grid;gap:12px;max-width:40ch}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:14px;color:var(--ink)}
.steps b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}
.steps span small{display:block;color:var(--faint);font-size:13px}
.mini-art{width:150px;height:auto;margin-top:8px}

/* Form card */
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;box-shadow:0 10px 30px -18px rgb(43 58 66 / .35)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field.full,.group.full,.option.full{grid-column:1/-1}
.fields{gap:18px 16px}
.group{margin:6px 0 -4px;padding-top:2px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.group:first-child{margin-top:0}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--ink);line-height:1.3}
.opt-tag{margin-left:6px;font-size:11.5px;font-weight:500;color:var(--faint)}
.field input,.field select{font:inherit;font-size:15px;line-height:1.3;width:100%;height:48px;padding:0 14px;border:1px solid #c9d2d8;border-radius:4px;background-color:#fff;color:var(--ink)}
.field input::placeholder{color:#94a0a9}
.field input:hover,.field select:hover{border-color:#9aa7b0}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.field input[aria-invalid=true]{border-color:var(--danger)}
.field input[type=date]{padding-right:10px;font-variant-numeric:tabular-nums}
.field input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.field input[type=number]{-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money{display:flex;align-items:stretch;height:48px;border:1px solid #c9d2d8;border-radius:4px;background:#fff;overflow:hidden}
.money:hover{border-color:#9aa7b0}
.money:focus-within{outline:2px solid var(--green);border-color:var(--green)}
.money.invalid{border-color:var(--danger)}
.field .money select,.field .money input{height:46px;border:0;border-radius:0;outline:0;background-color:transparent}
.field .money select{flex:0 0 78px;width:78px;padding:0 26px 0 14px;font-weight:600;border-right:1px solid var(--line);-webkit-appearance:none;appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1.5 1.5l4.5 4.5 4.5-4.5' fill='none' stroke='%235f6c76' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.field .money input{flex:1;min-width:0}
.field .money select:focus,.field .money input:focus{outline:0;border-color:transparent}
.field .money select:focus{border-right-color:var(--line)}
.option{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:var(--wash);font-size:14px;font-weight:600;cursor:pointer;line-height:1.35}
.option input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--green)}
.option small{display:block;margin-top:3px;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.5}
.option:hover{border-color:#b7c3cb}
.err{margin:5px 0 0;font-size:13px;font-weight:600;color:var(--danger)}
.card h2{margin-bottom:4px;font-size:22px}
.card .btn{margin-top:8px}
.hint{margin:12px 0 0;font-size:13px;color:var(--faint)}

.msgs{list-style:none;margin:0;padding:0}
.msgs li{border-bottom:1px solid var(--line);background:var(--green-soft);padding:12px 0;font-size:14px}
.msgs li .wrap{display:block}
.msgs .error{background:#fdeceb;color:#7a1d15}
.msgs .warning{background:#fff4e0;color:#6b4300}

/* Tracking */
.built{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:30px}
.built-item{border:1px solid var(--line);border-radius:6px;padding:24px;background:#fff}
.built-item .ico{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--green-soft);color:var(--green);margin-bottom:14px}
.built-item .ico svg{width:22px;height:22px}
.built-item h3{margin:0 0 6px;font-size:16px;font-weight:600}
.built-item p{margin:0 0 14px;font-size:14px;color:var(--muted)}
.built-item a{font-size:13px;font-weight:600;text-decoration:none}
.sched{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.sched li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}
.sched b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}
.sched small{display:block;color:var(--faint);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0 18px}
.stat{border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff}
.stat small{display:block;color:var(--faint);font-size:12.5px}
.stat b{display:block;font-size:20px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.stat b.small{font-size:15px}
.table-card{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar[hidden]{display:none}
.tab{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.tab span{margin-left:4px;font-weight:500;color:var(--faint)}
.tab:hover{background:var(--wash)}
.tab.on{background:var(--green-soft);color:var(--green-dark)}
.tab.on span{color:var(--green)}
.scroll{overflow-x:auto}
table.inv{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45}
table.inv th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 10px;background:var(--wash);border-bottom:1px solid var(--line);white-space:nowrap}
table.inv td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.inv th:first-child,table.inv td:first-child{padding-left:16px}
table.inv th:last-child,table.inv td:last-child{padding-right:12px}
table.inv tbody tr:last-child td{border-bottom:0}
table.inv tbody tr:hover td{background:#fafcfd}
table.inv tr[hidden]{display:none}
table.inv th.num,table.inv td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.inv th.end,table.inv td.end{text-align:right}
td .name{display:block;font-weight:600;color:var(--ink);max-width:180px}
td .client{display:block;color:var(--ink)}
td .sub{display:block;color:var(--faint);font-size:12.5px;line-height:1.4}
td .ell{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.inv td.nowrap{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#eceff2;color:#47535c}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.sent{background:#e1eefb;color:#1b5ca8}
.chip.overdue{background:#fdeceb;color:#a3281d}
.chip.paid{background:var(--green-soft);color:var(--green-dark)}
.chip.void{background:#eceff2;color:#6f7b85}
.dots{display:inline-flex;gap:6px;align-items:center;margin-bottom:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dfe5e9;vertical-align:middle}
.dot.sent{background:var(--green)}
.dot.failed{background:var(--danger)}
.dot.next{background:#fff;box-shadow:inset 0 0 0 2px var(--green)}
.dot.pending,.dot.skipped{background:#dfe5e9}
.legend{margin:0;padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend .dot{width:8px;height:8px;margin-right:-6px}
.acts{display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;white-space:nowrap}
.acts form{margin:0}
.mini{font:inherit;font-size:12.5px;font-weight:600;line-height:1;padding:8px 10px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.mini.primary{border-color:var(--green);color:var(--green)}
.mini.primary:hover{background:var(--green);color:#fff}
.mini.quiet:hover{background:var(--wash);color:var(--ink)}
.mini.danger:hover{background:#fdeceb;color:var(--danger)}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}


@media (max-width:860px){
  h1{font-size:28px}
  .hero{padding:44px 0 52px}
  .hero .wrap,.row{grid-template-columns:1fr;gap:32px}
  .hero .intro svg.art{max-width:420px;margin:12px auto 0}
  .section{padding:52px 0}
  .stats{grid-template-columns:1fr 1fr}
  .built{grid-template-columns:1fr}
  .nav a.plain{display:none}
  .card{padding:20px}
  .scroll{overflow:visible}
  table.inv,table.inv thead,table.inv tbody,table.inv tr,table.inv td{display:block}
  table.inv thead{position:absolute;left:-9999px}
  table.inv tr{border-bottom:1px solid var(--line);padding:12px 14px}
  table.inv tr:last-child{border-bottom:0}
  table.inv tbody tr:hover td{background:transparent}
  table.inv td{border:0;padding:5px 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;text-align:right}
  table.inv td::before{content:attr(data-label);color:var(--faint);font-size:12.5px;text-align:left;flex:none}
  table.inv td.num{white-space:normal}
  td .name{max-width:none}
  td .ell{max-width:none}
  .acts{justify-content:flex-start}
}
@media (max-width:480px){
  .wrap{padding:0 18px}
  .fields{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .logo{letter-spacing:.12em}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="{% url 'dashboard' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 7.5h8M8 12h8M8 16.5h4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      {{ business_name|default:"Invoices" }}
    </a>
    <nav class="nav" aria-label="Main">
      <a class="plain" href="#how">How it works</a>
      <a class="plain" href="#tracked">Tracking</a>
      <a class="plain" href="https://github.com/manishgupta412/django-invoice-reminders">GitHub</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
