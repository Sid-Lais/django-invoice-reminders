x-app: &app
  build: .
  env_file: .env
  environment:
    SQLITE_PATH: /data/invoices.sqlite3
  volumes:
    - invoice-data:/data
  init: true
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - docker/healthcheck.py
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  scheduler:
    <<: *app
    command: ["python", "-m", "docker.scheduler"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  invoice-data:
