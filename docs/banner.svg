<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Django Invoice Reminders</title>
  <desc id="desc">PDF invoices and automatic payment reminders from the Django admin, sent with the Mailtrap Email API</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3b2e"/>
      <stop offset="1" stop-color="#092e3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity=".06" fill="#fff">
    <circle cx="1180" cy="40" r="140"/>
    <circle cx="80" cy="320" r="110"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="122" fill="#ffffff" font-size="50" font-weight="700">Django Invoice Reminders</text>
    <text x="72" y="170" fill="#c9e7dc" font-size="24">PDF invoices and a polite payment-reminder sequence,</text>
    <text x="72" y="202" fill="#c9e7dc" font-size="24">straight from the Django admin.</text>
    <g font-size="16" font-weight="600">
      <rect x="72" y="234" width="114" height="34" rx="17" fill="#ffffff" fill-opacity=".12"/>
      <text x="129" y="256" fill="#ffffff" text-anchor="middle">Django 5</text>
      <rect x="198" y="234" width="126" height="34" rx="17" fill="#ffffff" fill-opacity=".12"/>
      <text x="261" y="256" fill="#ffffff" text-anchor="middle">Python 3.12</text>
      <rect x="336" y="234" width="170" height="34" rx="17" fill="#22d172" fill-opacity=".22"/>
      <text x="421" y="256" fill="#b8f5d3" text-anchor="middle">Mailtrap Email API</text>
    </g>
  </g>

  <!-- Invoice document -->
  <g transform="translate(860 52)" filter="url(#shadow)">
    <rect width="190" height="236" rx="10" fill="#ffffff"/>
    <rect x="20" y="22" width="70" height="10" rx="5" fill="#1f2937"/>
    <rect x="112" y="20" width="58" height="14" rx="4" fill="#2563eb"/>
    <rect x="20" y="52" width="150" height="2" fill="#e5e7eb"/>
    <rect x="20" y="70" width="60" height="7" rx="3" fill="#9ca3af"/>
    <rect x="20" y="84" width="90" height="9" rx="4" fill="#374151"/>
    <rect x="20" y="114" width="150" height="16" rx="3" fill="#2563eb"/>
    <rect x="20" y="138" width="150" height="14" fill="#f3f4f6"/>
    <rect x="26" y="142" width="80" height="6" rx="3" fill="#9ca3af"/>
    <rect x="136" y="142" width="28" height="6" rx="3" fill="#9ca3af"/>
    <rect x="26" y="162" width="64" height="6" rx="3" fill="#9ca3af"/>
    <rect x="136" y="162" width="28" height="6" rx="3" fill="#9ca3af"/>
    <rect x="96" y="190" width="74" height="10" rx="4" fill="#111827"/>
    <text x="95" y="226" fill="#16a34a" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PDF</text>
  </g>

  <!-- Envelope -->
  <g transform="translate(1004 168)" filter="url(#shadow)">
    <rect width="176" height="112" rx="12" fill="#ffffff"/>
    <path d="M10 14 L88 70 L166 14" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="164" cy="12" r="22" fill="#dc2626"/>
    <text x="164" y="19" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">4</text>
  </g>
</svg>
